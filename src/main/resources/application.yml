spring:
  application:
    name: bookhop                  # tên ứng dụng

  profiles:
    active: dev                    # môi trường đang chạy (dev/test/prod)

  jpa:                             # cấu hình JPA/Hibernate
    hibernate:
      ddl-auto: update             # tự động cập nhật bảng DB theo entity
    show-sql: true                 # hiển thị câu SQL trong console

  datasource:                      # cấu hình kết nối cơ sở dữ liệu
    url: jdbc:mysql://localhost:3306/bookshop
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url: jdbc:mysql://161.248.147.127:3306/bookshop
    # username: ellie
    # password: Ellie123#

  servlet:
    multipart:                     # cấu hình upload file
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    web:
      pageable:                    # cấu hình phân trang
        one-indexed-parameters: true

  mail:                            # cấu hình gửi email SMTP
    host: smtp.gmail.com
    port: 587
    username: bookshop.dpdns.org@gmail.com
    password: fzyhqujnhakuiimh
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  jackson:
    property-naming-strategy: SNAKE_CASE   # định dạng tên field JSON dạng snake_case

server:
  port: 8080                     # cổng server

app:
  upload-file:                   # cấu hình thư mục lưu file upload
    base-path: bookshop/upload/
